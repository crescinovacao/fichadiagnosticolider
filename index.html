  perfil(){
    const eq = equipa();
    openModal(`<button class="modal-x" data-a="fechar" aria-label="Fechar" title="Fechar"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><h2>O meu perfil</h2>
      <div class="perfil-card"><span class="av">${esc(iniciais(S.lider?.nome))}</span><div><b>${esc(S.lider?.nome)}</b><span class="hint">${eq.length} ${eq.length === 1 ? 'pessoa' : 'pessoas'} na equipa</span></div></div>
      <div class="field"><span>Código do espaço</span>
        <div class="codebox"><span class="code">${S.code}</span><button class="btn ghost small" data-a="copiar" data-link="${S.code}">Copiar</button></div>
        <p class="hint">Use este código para abrir a sua equipa noutro computador ou navegador. Guarde-o e não o partilhe: quem o tiver consegue ver as fichas.</p></div>
      <div class="modal-acts" style="margin-top:24px"><button class="btn ghost danger" data-a="apagarTudo">Apagar dados</button><button class="btn primary" data-a="sair">Sair</button></div>`);
  },
  confirmar(){ const f = S.acaoConfirmar; S.acaoConfirmar = null; closeModal(); f?.(); },
  toggleSide(){ S.col = !S.col; LS.set('fdl-side', S.col ? '1' : '0'); renderSide(); },
  apagarTudo(){
    confirmar({titulo:'Apagar todos os dados?', botao:'Apagar tudo', acao:() => A.confirmarApagar(),
      texto:`O espaço de ${esc(S.lider?.nome)}, todas as fichas da equipa e os links de mapeamento deixam de existir. As pessoas que ainda não responderam deixam de conseguir abrir o link.`});
  },
  async confirmarApagar(){
    const upd = {[`lideres/${S.code}`]: null};
    equipa().forEach(c => { if (c.token) upd[`convites/${c.token}`] = null; });
    const code = S.code; S.unsub?.(); S.unsub = null;
    try { await DB.update('', upd); } catch (e) { erroGuardar(e); }
    if (code) sair(); toast('Dados apagados.');
  },
  nTog(el){
    const pn = document.getElementById(el.dataset.p); if (!pn) return;
    const abrir = pn.hidden; pn.hidden = !abrir; el.setAttribute('aria-expanded', abrir);
  },
  sel(el){ S.sel = el.dataset.id; S.tab = 'resumo'; S.editTask = null; renderSide(); renderMain(); $('#main').scrollTop = 0; },
  tab(el){ S.tab = el.dataset.tab; S.editTask = null; renderMain(); $('#main').scrollTop = 0; },
  convidar(){
    openModal(`<h2>Convidar para a equipa</h2><p class="hint">A pessoa recebe um link próprio para o Mapeamento Motivacional. A ficha dela fica disponível para si desde já.</p>
      <label class="field"><span>Nome</span><input class="inp" id="c-nome" placeholder="Nome e apelido"></label>
      <label class="field"><span>Função</span><input class="inp" id="c-funcao" placeholder="Ex.: Técnica de Marketing"></label>
      <div class="modal-acts"><button class="btn ghost" data-a="fechar">Cancelar</button><button class="btn primary" data-a="criarConvite">Criar link</button></div>`);
  },
  async criarConvite(){
    const nome = $('#c-nome').value.trim(), funcao = $('#c-funcao').value.trim();
    if (!nome) { $('#c-nome').focus(); return toast('Escreva o nome da pessoa.'); }
    const id = 'C' + uid(6), token = uid(10);
    try {
      await DB.update('', {[`lideres/${S.code}/equipa/${id}`]: {nome, funcao, token, criadoEm:Date.now()}, [`convites/${token}`]: {lider:S.code, colab:id}});
      S.sel = id; S.tab = 'resumo'; renderSide(); renderMain();
      modalLink({nome, token});
    } catch (e) { erroGuardar(e); }
  },
  verLink(){ modalLink(colab()); },
  copiar(el){ copiar(el.dataset.link, el); },
  remover(){
    const c = colab();
    confirmar({titulo:`Remover ${esc(c.nome)} da equipa?`, botao:'Remover pessoa', acao:() => A.confirmarRemover(),
      texto:`A ficha completa é apagada: respostas ao mapeamento, estilos de liderança, potencial e desempenho, perfil IPL e todos os registos. O link de mapeamento deixa de funcionar.`});
  },
  async confirmarRemover(){
    const c = colab(), id = S.sel; S.sel = 'equipa';
    try { await DB.update('', {[`lideres/${S.code}/equipa/${id}`]: null, [`convites/${c.token}`]: null}); } catch (e) { erroGuardar(e); }
  },
  nota(el){
    const i = +el.dataset.i, k = +el.dataset.k, v = +el.dataset.v;
    const tars = tarefasDe(colab()); const n = tars[i].n.slice(); n[k] = n[k] === v ? 0 : v;
    W(`estilos/tarefas/${i}/n`, n);
  },
  editTask(el){ S.editTask = +el.dataset.i; renderMain(); },
  fecharTask(){ S.editTask = null; renderMain(); },
  addTask(){ const t = tarefasDe(colab()); if (t.length >= 5) return; t.push({nome:'', n:Array(10).fill(0)}); S.editTask = t.length - 1; W('estilos/tarefas', t); setTimeout(() => { const ins = document.querySelectorAll('.task-top .inp'); ins[ins.length - 1]?.focus(); }, 50); },
  rmTask(el){
    const i = +el.dataset.i, nome = tarefasDe(colab())[i]?.nome;
    confirmar({titulo:'Remover esta tarefa?', botao:'Remover tarefa',
      texto:`${nome ? `A tarefa <b>${esc(nome)}</b> e as` : 'As'} avaliações de capacidade e vontade desta tarefa são apagadas.`,
      acao:() => { const t = tarefasDe(colab()); t.splice(i, 1); S.editTask = null; W('estilos/tarefas', t.length ? t : null); }});
  },
  pd(el){ const r = calcPD(colab().potencial).r; const i = +el.dataset.i, v = +el.dataset.v; r[i] = r[i] === v ? 0 : v; W('potencial/r', r); },
  ipl(el){
    const cur = {e1:colab().ipl?.e1 || '', e2:colab().ipl?.e2 || ''}; const slot = el.dataset.slot, k = el.dataset.k, other = slot === 'e1' ? 'e2' : 'e1';
    if (cur[slot] === k) cur[slot] = ''; else { cur[slot] = k; if (cur[other] === k) cur[other] = ''; }
    if (!cur.e1 && cur.e2) { cur.e1 = cur.e2; cur.e2 = ''; }
    W('ipl', cur);
  },
  novoReg(el){ modalReg(el.dataset.tipo); },
  abrirReg(el){ modalReg(el.dataset.tipo, el.dataset.id); },
  addSit(){
    const box = $('#m-sits'); const n = box.querySelectorAll('.sitbloco').length + 1;
    box.insertAdjacentHTML('beforeend', blocoSit(n, box.dataset.plano === '1')); renumSits();
    const novo = box.lastElementChild; novo.scrollIntoView({block:'nearest', behavior:'smooth'}); novo.querySelector('[name="situacao"]').focus();
  },
  rmSit(el){ el.closest('.sitbloco').remove(); renumSits(); },
  guardarReg(el){
    const tipo = el.dataset.tipo, f = document.querySelector(`.regmodal[data-form="${tipo}"]`);
    const itens = [...f.querySelectorAll('.sitbloco')].map(b => {
      const g = n => b.querySelector(`[name="${n}"]`).value.trim();
      return {situacao:g('situacao'), [tipo === 'plano' ? 'compromisso' : 'acao']:g('acao'), acompanhamento:g('acompanhamento')};
    }).filter(x => x.situacao);
    if (!itens.length) { f.querySelector('[name="situacao"]')?.focus(); return toast('Descreva pelo menos uma situação.'); }
    const id = el.dataset.id, antigo = id ? colab()?.[tipo]?.[id] : null;
    const r = {data:f.querySelector('[name="data"]').value, itens, t:antigo?.t || Date.now()};
    S.regSnap = null; closeModal(); W(`${tipo}/${id || 'R' + uid(8)}`, r);
  },
  rmReg(el){
    S.regSnap = null;
    const {tipo, id} = el.dataset, r = colab()?.[tipo]?.[id];
    confirmar({titulo:'Apagar este registo?', botao:'Apagar registo',
      texto:`O registo ${tipo === 'plano' ? 'do plano de desenvolvimento' : 'de feedback'}${r?.data ? ` de ${fmtD(r.data)}` : ''} é apagado.`,
      acao:() => W(`${tipo}/${id}`, null)});
  },
  /* teste */
  't-go'(el){
    const to = el.dataset.to;
    if (to === 'e2' && TT.v.size !== 20) return;
    if (to === 'e2') TT.s = new Set([...TT.s].filter(n => TT.v.has(n)));
    TT.etapa = to; guardarProgresso(); renderTeste();
  },
  't-pdf'(el){ gerarPDF(el); },
  't-recomecar'(){
    confirmar({titulo:'Recomeçar o mapeamento?', botao:'Recomeçar',
      texto:`As ${TT.v.size} afirmações que já escolheu${TT.s.size ? ' e as que marcou como satisfeitas' : ''} são apagadas e começa do zero.`,
      acao:() => { TT.v = new Set(); TT.s = new Set(); TT.retomar = null; TT.etapa = 'instr'; guardarProgresso(); renderTeste(); }});
  },
  't-val'(el){
    const n = +el.dataset.n;
    if (TT.v.has(n)) TT.v.delete(n);
    else { if (TT.v.size >= 20) return toast('Já escolheu 20. Desmarque uma para trocar.'); TT.v.add(n); }
    guardarProgresso(); atualizarE1();
  },
  't-sat'(el){
    const n = +el.dataset.n; TT.s.has(n) ? TT.s.delete(n) : TT.s.add(n);
    el.classList.toggle('sel', TT.s.has(n)); el.setAttribute('aria-pressed', TT.s.has(n)); guardarProgresso();
  },
  async 't-enviar'(el){
    el.disabled = true; el.textContent = 'A enviar…';
    const ts = Date.now();
    try {
      await DB.set(`lideres/${TT.L}/equipa/${TT.C}/motivadores`, {valorizadas:[...TT.v], satisfeitas:[...TT.s], respondidoEm:ts});
      clearTimeout(tRasc); DB.remove(`lideres/${TT.L}/equipa/${TT.C}/rascunho`).catch(() => {});
      LS.del('fdl-teste-' + TT.token); TT.enviado = ts; TT.etapa = 'resultado'; renderTeste();
    } catch (e) { erroGuardar(e); el.disabled = false; el.textContent = 'Ver o meu resultado'; }
  }
};
const blocoSit = (n, plano, x = {}) => `<div class="sitbloco">
  <div class="sitbloco-h"><span class="sitn">${n}</span><b>Situação ${n}</b><button class="sitx" data-a="rmSit" aria-label="Remover situação ${n}" title="Remover situação"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
  <label class="field"><span>Situação</span><textarea class="inp" name="situacao" rows="2" placeholder="Descreva a situação">${esc(x.situacao || '')}</textarea></label>
  <label class="field"><span>${plano ? 'Compromisso' : 'Ação do líder'}</span><textarea class="inp" name="acao" rows="2">${esc(x.acao || '')}</textarea></label>
  <label class="field"><span>Acompanhamento</span><textarea class="inp" name="acompanhamento" rows="2">${esc(x.acompanhamento || '')}</textarea></label></div>`;
/* Modal de cadastro: sem id cria um registo novo; com id abre o registo para ver, editar ou apagar */
function modalReg(tipo, id){
  const plano = tipo === 'plano', r = id ? colab()?.[tipo]?.[id] : null;
  if (id && !r) return;
  const its = r ? itensReg(r) : [{}];
  const titulo = r ? (plano ? 'Registo do plano' : 'Feedback') : (plano ? 'Novo registo no plano' : 'Novo feedback');
  openModal(`<button class="modal-x" data-a="fechar" aria-label="Fechar" title="Fechar"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><h2>${titulo}</h2>
    <p class="hint">Cada situação tem ${plano ? 'o seu compromisso' : 'a sua ação do líder'} e o seu acompanhamento.</p>
    <div class="regmodal" data-form="${tipo}">
      <label class="field" style="max-width:190px"><span>Data</span><input class="inp" type="date" name="data" value="${r?.data || new Date().toISOString().slice(0, 10)}"></label>
      <div id="m-sits" data-plano="${plano ? 1 : 0}">${its.map((x, i) => blocoSit(i + 1, plano, x)).join('')}</div>
      <div style="display:flex;justify-content:center"><button class="btn link" data-a="addSit">+ Adicionar outra situação</button></div>
    </div>
    <div class="modal-acts" style="margin-top:20px">
      ${r ? `<button class="btn ghost danger" data-a="rmReg" data-tipo="${tipo}" data-id="${id}">Apagar registo</button>` : '<span></span>'}
      <button class="btn primary" data-a="guardarReg" data-tipo="${tipo}"${id ? ` data-id="${id}"` : ''}>Guardar</button></div>`);
  renumSits();
  document.querySelectorAll('#m-sits textarea').forEach(autoAltura);
  S.regSnap = snapReg();
  setTimeout(() => r ? $('.modal h2')?.setAttribute('tabindex', '-1') || $('.modal h2')?.focus() : $('#m-sits [name="situacao"]')?.focus(), 40);
}
function renumSits(){
  const bs = document.querySelectorAll('#m-sits .sitbloco');
  bs.forEach((b, i) => { b.querySelector('.sitn').textContent = i + 1; b.querySelector('.sitbloco-h b').textContent = `Situação ${i + 1}`; b.querySelector('.sitx').hidden = bs.length === 1; });
}
/* Guarda uma "fotografia" do formulário para saber se houve alterações antes de fechar */
const snapReg = () => { const f = document.querySelector('.regmodal'); return f ? JSON.stringify([...f.querySelectorAll('input,textarea')].map(x => x.value)) : null; };
function tentarFechar(){
  const f = document.querySelector('.regmodal');
  if (f && S.regSnap !== null && snapReg() !== S.regSnap) return avisoDescartar();
  S.regSnap = null; closeModal();
}
function avisoDescartar(){
  if (document.querySelector('.modal-bg.topo')) return;
  $('#modal-root').insertAdjacentHTML('beforeend', `<div class="modal-bg topo" data-a="descBg"><div class="modal" role="alertdialog" aria-modal="true" style="max-width:460px">
    <div class="alerta"><span class="alerta-ico" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 2.5L18.5 17h-17L10 2.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 8v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="14.3" r="1" fill="currentColor"/></svg></span>
    <div><h2>Sair sem guardar?</h2><p class="hint" style="margin-bottom:0">Fez alterações neste registo que ainda não foram guardadas. Se sair agora, vão perder-se.</p></div></div>
    <div class="modal-acts" style="margin-top:22px"><button class="btn ghost" data-a="continuarEditar">Continuar a editar</button><button class="btn primary" style="background:#A0102A" data-a="descartar">Sair sem guardar</button></div></div></div>`);
  setTimeout(() => document.querySelector('.modal-bg.topo [data-a="continuarEditar"]')?.focus(), 30);
}
function confirmar({titulo, texto, botao, acao}){
  S.acaoConfirmar = acao;
  openModal(`<div class="alerta"><span class="alerta-ico" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 2.5L18.5 17h-17L10 2.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 8v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="14.3" r="1" fill="currentColor"/></svg></span>
    <div><h2>${titulo}</h2><p class="hint" style="margin-bottom:0">${texto}</p><p class="irrev">Esta ação não pode ser revertida.</p></div></div>
    <div class="modal-acts" style="margin-top:22px"><button class="btn ghost" data-a="fechar">Cancelar</button><button class="btn primary" style="background:#A0102A" data-a="confirmar">${botao}</button></div>`);
  setTimeout(() => $('#modal-root [data-a="fechar"]')?.focus(), 40);
}
function modalLink(c){
  const l = linkConvite(c.token);
  openModal(`<h2>Link de ${esc(primeiroNome(c.nome))}</h2><p class="hint">Envie este link por e-mail ou mensagem. Ao abrir, ${esc(primeiroNome(c.nome))} responde ao Mapeamento Motivacional e o resultado aparece na ficha.</p>
    <div class="linkbox"><input class="inp" readonly value="${l}" aria-label="Link do mapeamento"><button class="btn ghost" data-a="copiar" data-link="${l}">Copiar</button></div>
    <div class="modal-acts"><a class="btn ghost" href="${l}" target="_blank" rel="noopener">Abrir o teste</a><button class="btn primary" data-a="fechar">Concluído</button></div>`);
}
/* Dica ao passar o rato por cima das bolinhas das matrizes */
let tipEl = null;
function mostrarTip(g){
  const txt = g.dataset.tip; if (!txt) return;
  if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'tip'; document.body.appendChild(tipEl); }
  const r = (g.querySelector('circle') || g).getBoundingClientRect();
  tipEl.innerHTML = g.dataset.sub ? `<b>${esc(txt)}</b><span>${esc(g.dataset.sub)}</span>` : esc(txt); tipEl.style.left = (r.left + r.width / 2) + 'px'; tipEl.style.top = r.top + 'px'; tipEl.style.display = 'block';
}
const esconderTip = () => { if (tipEl) tipEl.style.display = 'none'; };
document.addEventListener('mouseover', e => { const g = e.target.closest?.('[data-tip]'); g ? mostrarTip(g) : esconderTip(); });
document.addEventListener('focusin', e => { const g = e.target.closest?.('[data-tip]'); if (g) mostrarTip(g); });
document.addEventListener('focusout', e => { if (e.target.closest?.('[data-tip]')) esconderTip(); });
document.addEventListener('scroll', esconderTip, true);
document.addEventListener('click', e => { esconderTip(); const el = e.target.closest('[data-a]'); if (el && A[el.dataset.a]) A[el.dataset.a](el, e); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (document.querySelector('.modal-bg.topo')) A.continuarEditar(); else tentarFechar(); }
  if (e.key === 'Enter' && e.target.matches?.('tbody.reg')) A.abrirReg(e.target);
  if (e.key === 'Enter' && e.target.matches('#l-nome')) A.criarEspaco();
  if (e.key === 'Enter' && e.target.matches('#l-code')) A.entrarCodigo();
  if (e.key === 'Enter' && e.target.matches('#c-nome,#c-funcao')) A.criarConvite();
});

/* ================= ARRANQUE ================= */
(async () => {
  DB = await initDB();
  const tk = new URLSearchParams(location.search).get('convite');
  if (tk) return startTeste(tk);
  const saved = LS.get('fdl-lider');
  if (saved) return openLider(saved);
  renderLanding();
})();
</script>
</body>
</html>
