<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de Diagnóstico do Líder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#210000;--ink2:#5E5553;--ink3:#948A87;
  --line:#E7E1DE;--soft:#F7F4F3;--soft2:#EFEAE8;
  --az:#007BEA;--az-c:#B3DFFF;--az-e:#001B71;
  --sat:#CFE5B1;--nsat:#5E5553; /* cores do gráfico do Mapeamento Motivacional (padrão do teste) */
}
html,body{height:100%}
body{font-family:'Aptos','Segoe UI',system-ui,-apple-system,sans-serif;color:var(--ink);background:#fff;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Raleway',sans-serif;font-weight:700;line-height:1.2}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--az);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.view{display:none}.view.on{display:block}
.muted{color:var(--ink3)}
.hint{font-size:13px;color:var(--ink2)}

/* botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;border:1.5px solid transparent;transition:background .15s,border-color .15s;white-space:nowrap}
a.btn{text-decoration:none;color:var(--ink)}
.btn.btn.copiado{background:#CFE5B1;border-color:#CFE5B1;color:#385438}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#431616}
.btn.primary:disabled{background:#cfc7c5;cursor:not-allowed}
.btn.ghost{border-color:var(--line);background:#fff}
.btn.ghost:hover{border-color:var(--ink3)}
.btn.small{padding:6px 12px;font-size:13px}
.btn.link{padding:0;border:0;font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.btn.danger{color:#A0102A}
.btn.full{width:100%}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.inp{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.inp:focus{border-color:var(--ink);outline:none}
textarea.inp{resize:none;min-height:64px;overflow-y:hidden;line-height:1.45}

/* chips e caixas */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.cdot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;flex-shrink:0}
.box{border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.box-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
/* Hierarquia dos cartões: título > subtítulo > texto */
.box-h h2{font-size:19px;font-weight:800;color:#210000}
.box{font-size:14px;color:var(--ink2)}
.box .sub{display:block;font-family:'Raleway',sans-serif;font-size:15px;font-weight:700;color:#210000;margin-bottom:4px}
.box .txt,.box ul.plain li,.box .tbl td,.box .qdesc{font-size:14px;color:var(--ink2)}
.box .tbl th{font-family:'Raleway',sans-serif;font-size:15px;font-weight:700;color:#210000}
.box p+p .sub{margin-top:4px}
.box .btn.link{color:#210000}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mais{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.span2{grid-column:1/-1}
.sec{margin-bottom:36px}
.sec-h{margin-bottom:16px}
.sec-h h2{font-size:21px}
.sec-h p{margin-top:4px}
.empty{padding:28px 24px;border:1.5px dashed var(--line);border-radius:14px;color:var(--ink2)}
.empty h3{font-size:17px;color:var(--ink);margin-bottom:6px}
ul.plain{list-style:none;display:grid;gap:4px;margin-top:2px}
ul.plain li{font-weight:400}

/* toast e modal */
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:200;max-width:90vw;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.modal-bg{position:fixed;inset:0;background:rgba(33,0,0,.38);display:grid;place-items:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:500px;max-height:90vh;overflow:auto}
.modal h2{font-size:21px;margin-bottom:6px}
.modal{position:relative}
.modal-x{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:8px;font-size:24px;line-height:1;color:var(--ink2);display:grid;place-items:center}
.modal-x:hover{background:var(--soft2);color:var(--ink)}
.modal-x+h2{padding-right:40px}
.modal-bg.topo{z-index:110}
.btn.ghost.danger{border-color:#F3C2CB}
.btn.ghost.danger:hover{background:#FDF0F2;border-color:#A0102A}
.modal .hint{margin-bottom:18px}
/* Dois botões: cada um num extremo (cancelar à esquerda, ação principal à direita) */
.modal-acts{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.linkbox{display:flex;gap:8px;margin:14px 0 18px}
.linkbox .inp{font-size:13px}

/* ===== LANDING ===== */
.landing{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr}
.land-intro{background:var(--ink);color:#fff;padding:72px 64px;display:flex;flex-direction:column;justify-content:center}
.land-logo{display:block;height:44px;width:auto;margin-bottom:48px;align-self:flex-start}
.land-intro h1{font-size:clamp(36px,4.4vw,60px);font-weight:800;max-width:11ch;letter-spacing:-.01em}
.land-intro>p{max-width:44ch;margin-top:22px;color:#EADFDC;font-size:17px}
.land-steps{list-style:none;margin-top:48px;display:grid;gap:18px;max-width:44ch;counter-reset:s}
.land-steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;color:#fff}
.land-steps li::before{content:counter(s);font-family:'Raleway',sans-serif;font-weight:800;font-size:22px;line-height:1.1;color:var(--az-c)}
.land-box{padding:72px 64px;display:flex;flex-direction:column;justify-content:center;max-width:540px;width:100%}
.land-box h2{font-size:20px;margin-bottom:14px}
.land-sep{height:1px;background:var(--line);margin:28px 0}
.modo{margin-top:30px;font-size:12px;color:var(--ink3)}
.erro{color:#A0102A;font-size:13px;margin-top:-6px;margin-bottom:10px}

/* ===== APP DO LÍDER ===== */
.app{display:grid;grid-template-columns:288px 1fr;height:100vh}
.side{background:var(--soft);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{padding:22px 14px 14px 20px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.side-toggle{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;color:var(--ink2)}
.side-toggle:hover{background:var(--soft2);color:var(--ink)}
.app{transition:grid-template-columns .2s ease}
.app.col{grid-template-columns:72px 1fr}
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0;height:100%;overflow:auto}
.rail .side-toggle{margin-bottom:10px}
.rail-item{position:relative;padding:4px;border-radius:50%}
.rail-item .av{width:38px;height:38px}
.rail-item:hover .av{box-shadow:0 0 0 2px var(--line)}
.rail-item.on .av{box-shadow:0 0 0 2px var(--ink)}
.rail-item .st{position:absolute;right:3px;bottom:3px;width:12px;height:12px;border:2px solid #fff}
.rail-sep{width:28px;height:1px;background:var(--line);margin:6px 0}
.rail-add{width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;font-size:22px;line-height:1;display:grid;place-items:center;margin-top:8px}
.est-res{display:grid;grid-template-columns:300px minmax(0,1fr);gap:32px;align-items:start}
.tnum.sm{width:22px;height:22px;font-size:11px}
.modal .alerta{display:flex;gap:14px;align-items:flex-start}
.modal .alerta-ico{width:40px;height:40px;border-radius:50%;background:#F9CBD2;color:#A0102A;display:grid;place-items:center;flex-shrink:0}
.modal .irrev{margin-top:12px;padding:10px 12px;border-radius:10px;background:#FDF0F2;color:#62003B;font-size:13.5px;font-weight:600}
.brand{font-family:'Raleway',sans-serif;font-weight:800;font-size:17px;line-height:1.15}
.side-list{flex:1;overflow:auto;padding:4px 10px 12px}
.side-item{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;text-align:left}
.side-item:hover{background:var(--soft2)}
.side-item.on{background:#fff;box-shadow:inset 0 0 0 1.5px var(--ink)}
.side-sub{font-size:12px;color:var(--ink2);padding:18px 10px 6px;font-weight:600}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:'Raleway',sans-serif;font-weight:700;font-size:12.5px;background:var(--soft2);flex-shrink:0}
.av.team{background:var(--ink);color:#fff}
.who{flex:1;min-width:0}
.who b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{width:9px;height:9px;border-radius:50%;background:#E6233A;flex-shrink:0}
.st.ok{background:#77AD18}
.side-invite{padding:0 20px 16px}
.side-foot{padding:10px 10px 14px;border-top:1px solid var(--line);font-size:13px}
.perfil-btn{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;text-align:left;color:var(--ink2)}
.perfil-btn:hover{background:var(--soft2);color:var(--ink)}
.perfil-btn .av{background:var(--ink);color:#fff}
.perfil-btn .who b{color:var(--ink)}
.perfil-card{display:flex;align-items:center;gap:14px;margin:6px 0 22px}
.perfil-card .av{width:52px;height:52px;font-size:18px;background:var(--ink);color:#fff}
.perfil-card b{display:block;font-family:'Raleway',sans-serif;font-size:19px}
.codebox{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--soft);border-radius:12px;padding:14px 16px;margin-bottom:8px}
.codebox .code{font-family:'Raleway',sans-serif;font-weight:800;font-size:22px;letter-spacing:.12em}
.side-foot b{display:block;font-size:14px}
.side-foot .code{font-family:'Raleway',sans-serif;font-weight:700;letter-spacing:.04em}
.side-foot .row{display:flex;gap:14px;margin-top:10px}
.main{overflow:auto;min-height:0}
.wrap{max-width:1200px;margin:0 auto;padding:36px 44px 90px;container-type:inline-size}
.tile .tl,.tile .tv{white-space:nowrap}
/* Cor só na aba selecionada; nas outras, o resumo fica neutro */
.tile .tv .cor{font-weight:700}
.tile:not(.on) .tv .cor{color:var(--ink2)!important;font-weight:400}
.tile .tv span{overflow:hidden;text-overflow:ellipsis}


/* cabeçalho da ficha */
.fhead{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.av.big{width:62px;height:62px;font-size:21px;background:var(--ink);color:#fff}
.fhead h1{font-size:32px;font-weight:800}
.fhead p{color:var(--ink2)}
.fhead .acts{margin-left:auto;display:flex;gap:8px}
/* Abas sempre em duas linhas: título numa linha e resumo noutra; a largura de cada aba acompanha o título */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(max-content,1fr));margin:26px 0 34px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tile{padding:14px 14px 17px;text-align:left;border-right:1px solid var(--line);position:relative;min-width:0;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
.tile:last-child{border-right:0}
.tile:hover{background:var(--soft)}
.tile.on{background:var(--soft)}
.tile.on::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--ink)}
.tile .tl{font-family:'Raleway',sans-serif;font-weight:700;font-size:14.5px;line-height:1.25;color:var(--ink);display:block}
.tile .tv{font-size:13.5px;line-height:1.35;color:var(--ink2);display:flex;align-items:flex-start;margin-top:6px}
.tile .tv .cdot{margin-top:4px}
.tile .tv.muted{color:var(--ink3)}

/* barras dos motivadores */
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-bottom:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:170px 1fr 40px;align-items:center;gap:12px;font-size:13.5px}
.bar-t{height:18px;background:var(--soft);border-radius:4px;display:flex;overflow:hidden}
.bar-s{background:var(--sat)}.bar-n{background:var(--nsat)}
.bar.dim .bl{color:var(--ink3)}
.bar.top .bl{font-weight:700}
.bv{font-variant-numeric:tabular-nums;color:var(--ink2);text-align:right;font-size:13px}
.needs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.need{border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.need h3{font-size:17px;margin-bottom:2px}
.need .rk{font-size:12.5px;color:var(--ink2);margin-bottom:10px;display:block}
.need p{font-size:14px;color:var(--ink2)}
.needs.lista{grid-template-columns:1fr}
.ntogs{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.ntog{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;border:1.5px solid transparent;background:var(--soft2);font-size:13.5px;font-weight:600;transition:background .15s,border-color .15s,color .15s}
.ntog:hover{background:#E3DCD9}
.ntog .n{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#fff;font-size:12px}
.ntog i{width:7px;height:7px;border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.ntog[aria-expanded="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.ntog[aria-expanded="true"] .n{background:rgba(255,255,255,.2)}
.ntog[aria-expanded="true"] i{transform:rotate(-135deg) translateY(-1px)}
.npn{margin-top:14px}
.nd-b .npn b{font-size:14px;margin-bottom:6px}
.npn ul{list-style:none;background:var(--soft);border-radius:10px;padding:4px 14px}
.npn li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink)}
.npn li:last-child{border-bottom:0}
.npn li .cdot{margin:0;transform:translateY(1px)}
.npn li em{font-style:normal;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.acao{margin-top:14px;padding:14px 16px;background:var(--soft);border-radius:10px;font-size:14px}
.acao b{display:block;font-family:'Raleway',sans-serif;margin-bottom:4px}
details.nd{border-top:1px solid var(--line);padding:12px 0}
details.nd:last-child{border-bottom:1px solid var(--line)}
details.nd summary{cursor:pointer;font-weight:600;display:flex;align-items:center;gap:16px;list-style:none;padding:2px 0}
details.nd summary .qt{margin-left:auto;font-size:13px;font-weight:500;color:var(--ink2);font-variant-numeric:tabular-nums}
details.nd.zero summary{color:var(--ink3);font-weight:500}
details.nd.zero summary .qt{color:var(--ink3)}
details.nd summary:hover{color:var(--ink)}
details.nd summary::-webkit-details-marker{display:none}
details.nd summary::after{content:'+';font-family:'Raleway',sans-serif;font-weight:700;font-size:18px;line-height:1;width:18px;text-align:center;color:var(--ink2)}
details.nd[open] summary::after{content:'−'}
details.nd .nd-b{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:10px;font-size:14px;color:var(--ink2)}
details.nd .nd-b b{display:block;color:var(--ink);font-family:'Raleway',sans-serif;margin-bottom:4px}
.lists{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.lists ul{list-style:none}
.lists li{padding:8px 0;border-bottom:1px solid var(--soft2);font-size:14px}
.lists h4{font-size:14px;margin-bottom:6px;display:flex;align-items:center}

/* estilos de liderança */
.two{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start}
.sticky{position:sticky;top:20px}
.task{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.task-top{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.tnum{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:'Raleway',sans-serif;font-weight:700;font-size:13px;flex-shrink:0}
.task-top .inp{flex:1;min-width:200px;font-weight:600}
.task.fechada{padding:14px 18px;margin-bottom:10px}
.task.fechada .task-top{margin-bottom:0;flex-wrap:nowrap}
.task.aberta{border-color:var(--ink);border-width:1.5px}
.tinfo{flex:1;min-width:0}
.tinfo b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tinfo small span{white-space:nowrap}
.tinfo small{display:flex;flex-wrap:wrap;column-gap:14px;font-size:12.5px;color:var(--ink2);margin-top:2px;font-variant-numeric:tabular-nums}
.task-foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
@media (max-width:560px){.task.fechada .task-top{flex-wrap:wrap}}
.crit-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.crit-col h4{font-size:14px;display:flex;justify-content:space-between;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.crit-col h4 span{font-family:'Aptos','Segoe UI',sans-serif;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.crit{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0;font-size:13.5px}
.seg{display:flex;gap:3px;flex-shrink:0}
.seg button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink2);background:#fff}
.seg button:hover{border-color:var(--ink3)}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg.big button{width:34px;height:32px;font-size:13px}
.mdesc{font-size:13.5px;color:var(--ink2);margin-top:16px}
.mdesc details{border-top:1px solid var(--line);padding:10px 0}
.mdesc summary{cursor:pointer;font-weight:600;color:var(--ink);display:flex;align-items:center}
.mdesc p{margin-top:8px}
.pt circle{transition:r .12s}
.pt:hover circle,.pt:focus circle{r:15}
.pt:focus{outline:none}
.pt.clicavel{cursor:pointer}
.tip{position:fixed;background:var(--ink);color:#fff;padding:6px 11px;border-radius:8px;font-size:13px;font-weight:600;pointer-events:none;z-index:300;transform:translate(-50%,calc(-100% - 10px));white-space:pre-line;max-width:280px;text-align:center;line-height:1.35}
.tip b{display:block;font-weight:700}
.tip span{display:block;font-weight:400;opacity:.85}
.chip[data-tip]{cursor:help}
.chip[data-tip]:hover,.chip[data-tip]:focus{box-shadow:0 0 0 1.5px currentColor;outline:none}
.tip::after{content:'';position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--ink)}
.matriz{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
.two.even{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.task{container-type:inline-size}
@container (max-width:780px){.crit{flex-direction:column;align-items:flex-start;gap:4px;padding:6px 0}}

/* potencial e desempenho */
.pdi{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.pdi .n{color:var(--ink3);font-variant-numeric:tabular-nums;font-size:13px}
.prog{height:6px;background:var(--soft2);border-radius:99px;margin:10px 0 18px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .2s}

utras pessoas percebam o quão bom eu consigo ser no meu trabalho.", "Reconhecimento"], [97, "Saber que tenho responsabilidade e poder de decisão para influenciar o curso dos acontecimentos.", "Poder"], [98, "Ter poucas pessoas a quem prestar satisfações ou que controlam o meu trabalho.", "Sentir Importante"], [99, "Poder trabalhar por prazer.", "Realização"], [100, "Sentir amor à camisola, que pertenço à organização e à equipa.", "Ideais e Valores"]], "pd": ["O colaborador investe em pesquisa e autoformação, em temas que permitam o seu desenvolvimento.", "O colaborador mostra-se curioso e a par das notícias do mercado, da concorrência e da organização.", "O colaborador procura novas formas de saber mais, de melhorar competências.", "O colaborador influencia os outros, ensinando e incentivando à melhoria e ao conhecimento.", "O colaborador toma a iniciativa de melhorar processos, propor novas ideias.", "O colaborador demonstra vontade de assumir novas tarefas e desafios.", "O colaborador mostra capacidade para gerir novos projetos.", "O colaborador influencia a equipa, com o seu entusiasmo e empenho.", "O colaborador é recetivo à mudança e aceita-a como uma oportunidade de melhoria.", "O colaborador demonstra capacidade para lidar com novas situações e aprender com elas.", "O colaborador tem a capacidade de entender o enquadramento geral de uma situação e pensar com visão, em termos gerais.", "O colaborador procura agir de forma segura em situações de incerteza, stress e maior dificuldade.", "O colaborador cria planos de Acão concretos para atingir metas e objetivos.", "O colaborador organiza previamente a sua atividade, de forma proactiva.", "O colaborador possui um método de organização pessoal que lhe permite registar informação, agendar tarefas e compromissos.", "O colaborador é flexível e procura distribuir o seu tempo, de acordo com a importância e urgência das situações.", "O colaborador procura proactivamente conhecer os seus clientes e as necessidades destes.", "O colaborador orienta o seu discurso e soluções para as oportunidades/necessidades do cliente.", "O colaborador preocupa-se em sentir as dificuldades dos clientes (internos e externos) e em dar respostas o mais imediatas possível.", "O colaborador procura novas formas de melhorar o serviço e a satisfação dos clientes.", "O colaborador mantém o empenho em atingir resultados superiores mesmo em situações difíceis.", "O colaborador celebra e move-se pelo cumprir (e superar) objetivos e metas exigentes.", "O colaborador tem noção da relação de tempo e esforço no seu desempenho.", "O colaborador age de forma decidida, procurando concluir a tarefa/vendas com sucesso."], "mdesc": {"DESCRIÇÃO M1 - RESISTENTE": "O Resistente é o colaborador que, numa tarefa, não é capaz e não deseja assumir responsabilidades ou é inseguro. É alguém que recebe uma tarefa nova ou que tem fortes resistências a determinada tarefa.\nEntão, como é que deve agir o Líder? Deve determinar, ou seja, dizer ao colaborador como fazer a tarefa e ensiná-lo. À medida que o colaborador vai aprendendo, vai conseguindo executar com êxito a tarefa e é provável que vá também ganhando mais vontade e confiança para fazer esse trabalho.", "DESCRIÇÃO M2 - ESFORÇADO": "Quando um colaborador, numa determinada tarefa, está motivado para a fazer, mas não tem ainda a capacidade (ou seja ainda não se pode deixá-lo sozinho, dar-lhe total autonomia!...).Nestas situações, o colaborador é um “esforçado”, com menos capacidade e mais vontade, ele ainda é Esforçado.\n\nO que fazer? Vender! Deve explicar, clarificar e vender os benefícios de determinados comportamentos ao seu colaborador. É uma questão de aproveitar o empenho e dar formação ou informação. O colaborador, já envolvido, estará mais disponível para desenvolver a competência. E, sendo mais fácil desenvolver a parte técnica (que é o que lhe falta) do que a parte da vontade (porque a motivação só pode ser influenciada), o grande cuidado a ter é o de fazer com que o colaborador não perca a vontade.", "DESCRIÇÃO M3 - INDIFERENTE / INSEGURO": "O “fulcro” da questão com um Colaborador Indiferente ou Inseguro está na vontade. É o exemplo mais evidente de um colaborador maduro que não quer arriscar, não quer mudar, é “muito dependente da aprovação do chefe”. É a prova de fogo para o líder, no sentido de saber se consegue motivar pessoas. E, uma vez que a motivação não se cria e só se influencia, o líder deve Participar. Deve começar por tentar perceber (não tentar adivinhar, mas sim procurar as razões!) o porquê dessa baixa vontade. Pode dar-se o caso de ser um colaborador, que tinha essa vontade (desejo de assumir responsabilidade, de fazer sozinho), mas que, por alguma razão, se desmotivou. Depois, deve dar-lhe confiança e apoiá-lo. As ações para o desenvolver devem ser combinadas em conjunto com ele, porque o colaborador tem a capacidade de poder sugerir o “como” desempenhar a tarefa. Estará assim a contribuir para a motivação e para a vontade de fazer do seu colaborador! Não se esqueça de elogiar, sempre que o desempenho e os progressos do colaborador o mereçam, porque é, particularmente, importante para este colaborador. Lembre-se: capacidade e formação, dão-se... O difícil está na motivação!", "DESCRIÇÃO M4 - AUTÓNOMO": "Quando um colaborador, numa tarefa, sabe e quer fazer. E qual é que será a melhor forma de atuar, como líder? Delegar!\n\nO colaborador tem a capacidade para executar a tarefa e a vontade de assumir a responsabilidade. Delegar, não é dizer “Faça” e esquecer; deve traçar os resultados esperados para cumprimento da tarefa e deixar ao colaborador o método (se disser ao colaborador tudo o que ele deve fazer e “como é que faria, no lugar dele”... é Determinar e isso só é eficaz para pessoas com baixa vontade e capacidade). Não interfira, a menos que tenha combinado com o colaborador pontos de controlo a meio do processo, para ele lhe dar feedback do decurso da tarefa. E delegar e andar “a espreitar por cima do ombro” não é delegar! Por fim, tenha a noção do impacto do elogio para este colaborador. O reconhecimento pelo resultado é especialmente eficaz."}, "quad": {"CINZA": "Um colaborador cinza é, tendencialmente, alguém que fica abaixo da média, em termos de performance e de potencial.\nO colaborador apresenta algum desajustamento à função, já que evidencia dificuldade em cumprir objetivos e metas. Grande parte do tempo, é alguém que depende de instruções precisas, não desenvolvendo um método próprio de organização. Demonstra dificuldades inclusive em visualizar os clientes como oportunidades. Em geral, a relação com outras entidades (clientes internos ou externos) não é pacífica nem é o seu foco.\nUm ambiente de mudança, com a necessidade de aprender, adaptar-se e manter a energia para atingir esses novos desafios são um ambiente angustiante para o Cinza.\nEste colaborador merecerá do líder uma reflexão ponderada acerca do seu futuro e até da sua continuidade na equipa. Poderá ajudá-lo a enquadrar-se melhor noutra tarefa ou função na organização.", "VERDE": "Um colaborador verde é o colaborador fiável, seguro, que cumpre as suas tarefas de forma precisa. Aprende em ambiente controlado e o seu foco é o raciocínio lógico e programado.\nÉ orientado para cumprir a sua função atual – organiza-se para atingir as metas, sem desmotivar.\nNa relação com os outros, é afável, cumpridor, com uma relação tranquila com regras e dificuldades, causadas por clientes, internos e externos.\nTambém por apreciar claramente o que faz, a ambição não faz parte dos seus planos. O seu foco é no momento presente, na reação e tratamento de situações presentes. Não se dedica a estudar ou a melhorar processos.\nAmbientes de incerteza, de crescimento, de flexibilidade não são particularmente atrativos.\nCabe ao líder contar com este elemento seguro na sua equipa, alguém que cumpre o que é solicitado mas que não tem ambição ou capacidades para progredir e evoluir.", "VERMELHO": "Um colaborador vermelho é um sinal de alerta. Tratando-se de uma pessoa que realiza a maioria das suas tarefas, de forma automática ou pouco dedicada, possuindo capacidade de crescimento futuro (potencial) acima da média, tal demonstra desadequação à função que ocupa atualmente ou alguma questão ao nível de dedicação e motivação do colaborador.\nUm colaborador vermelho evidencia investimento no seu desenvolvimento, recetividade a mudanças e a novas ideias. No entanto, não se mostra focado em resultados, não se organiza para os atingir nem atua proactivamente nas suas tarefas habituais.\nO seu desempenho é abaixo da média comparativamente menor, por comparação ao potencial de crescimento que revela.\nRequer do líder uma intervenção direta, no sentido de, com este perceber a sua adequação à função, a criação de desafios que consideram as suas capacidades e em que o colaborador se sinta aproveitado.", "INDIGO": "Um colaborador índigo evidencia no seu desempenho habitual, elevados padrões de execução, exigência e cumprimento. É fortemente movido pela realização de metas, por ter de se organizar para as cumprir e por não desistir ante desafios.\nNo entanto, o seu dia-a-dia é sempre complementado com uma visão crítica, de ser melhor, de procurar novas e melhores formas que o permitam chegar mais além. Cumpre de forma muito eficaz o que lhe é exigido e procura alterar o que é o seu dia a dia habitual. Rompe facilmente com o que é habitual porque o seu mote é realizar, conseguir e ir mais além.\nEste colaborador constitui um desafio já que se destaca pelo seu desempenho presente e será difícil encontrar substituto atual. O seu potencial deve ser explorado para outros desafios e realidades."}, "nec": [["Básicas", "São comuns a todos os animais variando somente as formas de as satisfazer. São necessidades fortemente determinadas pela cultura, como dormir, comer, ter uma casa.", "Em geral, estas necessidades são mais importantes como fonte de desmotivação quando não satisfeitas. Podem causar desconforto, irritabilidade, pelo que o Líder deve estar atento à importância que estas têm para o seu colaborador, garantindo as condições para que este as satisfaça. A preocupação com o poder dormir, comer ou necessitar que a sua remuneração seja satisfatória são necessidades valorizadas pelo colaborador e a ter em conta, marcado igualmente pela fase de vida em que o colaborador se encontra. O início de vida traz mais importância a estas necessidades e a evolução de carreira faz com que estas percam a importância para a motivação do colaborador (são importantes mas não o movem). Uma situação de frustração criará o alerta de que as questões mais básicas prendem o colaborador a não cumprir o seu potencial de realização das tarefas."], ["De Segurança", "Este tipo de necessidade pode ser definida em dois níveis: físico e psicológico. A nível físico, refere-se essencialmente à segurança das necessidades fisiológicas. A segurança psicológica prende-se com a certeza de não sermos vítimas de tratamentos arbitrários, dominando o meio e minimizando a incerteza.", "Por experiências do passado, por circunstâncias presentes ou por o colaborador se sentir apreensivo com o ambiente, com a sua condição laboral (contratual), o líder deverá estar atento ao valor que o colaborador dá a estas necessidades, já que, como as necessidades básicas, só desmotivam se não satisfeitas. Perante uma situação de frustração, cabe ao líder fornecer o conforto necessário ao colaborador (dentro do seu poder e autonomia) fornecendo as garantias mínimas a nível da saúde, contrato, estabilidade financeira (ordenado certo) que permitam ao colaborador tranquilizar-se e dar o seu melhor."], ["Curiosidade", "Atracção pela novidade, pelo desconhecido, pelo exótico.", "Esta necessidade deve merecer do líder a atenção para propor ao colaborador tarefas que lhe permitam pesquisar, deter informação e conhecer mais, da realidade que o rodeia. Uma vez que um colaborador que valoriza esta necessidade em geral aprecia saber “os porquês”, dar-lhe informação é uma forma de preencher essa necessidade."], ["Sociais", "Necessidade de pertença a um grupo social, de proximidade com os outros (amor, amizade, convívio)", "Em geral traduzidas no local de trabalho pela necessidade de afiliação e afectividade, é importante que o líder identifique estas necessidades no seu colaborador, permitindo que este se envolva em tarefas de grupo, equipas e projectos (mais do que trabalhar sozinho), permitindo-lhe poder partilhar ideias e pontos de vista. É igualmente importante considerar que a frustração desta necessidade pode igualmente envolver o tempo disponibilizado para que o colaborador possa exercer esta necessidade na sua vida pessoal – família, amigos."], ["De se sentir Importante", "Todas as pessoas gostam de se sentir importantes e para tal, basta a atenção exercida sobre nós.", "Esta necessidade (puramente humana) justificará muitas acções, algumas delas até de chamada de atenção sobre si, considerada infantil ou injustificada. No entanto, o status, uma imagem de importância, conseguida com benefícios como viatura da empresa, uma designação de cargo ou um espaço de trabalho com destaque serão apreciados. O reconhecimento vindo de colegas, a necessidade de se sentir apreciado e admirado pelos que o rodeiam poderá receber do líder a escolha de acções como solicitar a opinião deste, delegar-lhe a possibilidade de integrar ou ensinar novos colaboradores, solicitar-lhe uma apresentação numa reunião ou outras que lhe dêem a importância e admiração dos outros que este tanto valoriza."], ["De Reconhecimento", "Necessidade de que apreciem o nosso trabalho, de forma justa e ligado directamente a recompensas sobre os objectivos atingidos.", "Especialmente ligada à função de liderança, alguns colaboradores esperam a aprovação da sua chefia para se sentirem realizados. Tratando-se de uma questão de equidade (retorno justo para quem se esforça, em comparação com os colegas) o facto é que um colaborador com necessidades de reconhecimento terá comportamentos centrados em si. Cabe-lhe, como líder, corresponder, dentro do razoável (e justo) a esta expectativa, tendo a preocupação de delegar tarefas de responsabilidade, salientando a sua competência, elogiando esforço e resultados e correspondendo com recompensas. Um colaborador que valoriza o reconhecimento move-se por feedback positivo ao que faz, necessitando de sentir que o esforço e dedicação são compensatórios."], ["De Poder", "Necessidade de sentir que controlamos os acontecimentos à nossa volta.", "Tratando-se de uma necessidade de controlo, para um colaborador que dá destaque a esta necessidade, o líder deverá corresponder com informação e com clareza na comunicação, na definição de objectivos e nas instruções de tarefas. Um colaborador com necessidade de poder carece de autonomia, de poder controlar o ambiente em redor e que só depende deste a decisão de como agir, de poder ser recompensado, pelo que o líder poderá delegar neste colaborador (caso este possua as capacidades necessárias) algumas das suas tarefas, o que resultará em motivação para o colaborador."], ["De Desenvolvimento", "Necessidade de crescer, saber mais, evoluir, ser mais competente.", "Esta necessidade traduz-se na vontade de crescer e evoluir. Um colaborador com esta necessidade estará disponível para aceitar novos desafios, novas tarefas que impliquem o seu crescimento. O líder deverá estar atento a esta necessidade, aproveitando a vontade do colaborador, a sua eficácia e o investimento que ele está disponível para fazer. Experiências novas, formação e informação, são formas do líder poder cumprir essa necessidade."], ["De Realização", "Necessidade responsável pelo comportamento que nos impulsiona para enfrentar desafios e pormos a nossa perícia e habilidade à prova, para realizar pelo simples prazer de conseguir fazer.", "Em geral, os colaboradores que valorizam esta necessidade apresentam níveis de maturidade elevados. Cumpridas outras necessidades mais elementares, é na auto-realização que encontram o que os move. É importante que o líder crie desafios, delegue neste colaborador (de uma forma segura), dando-lhe autonomia e independência, para que este possa sentir realizado todo o seu potencial, maximizando o uso das suas capacidades. Uma situação de frustração requer o envolvimento do colaborador e a descoberta do que este apreciaria como próximo desafio."], ["De ter Ideais e Valores", "O ser humano precisa de ter ideias, fé, causas nobres e justas, de valores que orientem o comportamento. Nas organizações, este sentimento promove “o amor à camisola”, algo que justifique o querer dar mais e melhor, em prol de uma organização em que acredita.", "É missão do líder potenciar esta necessidade, com acções que evidenciam a ética, a responsabilidade social da empresa e que sejam criadoras de um clima de confiança, de justiça, em geral valores que afectam os colaboradores. Uma situação de frustração pode demonstrar a falta de identidade do colaborador às práticas da empresa pelo que cabe ao líder perceber quais os valores que envolvem mais o colaborador e de que forma pode criar consonância entre eles."]], "ipl": [["DRIVER", "Pessoas muito ativas ao lidar com problemas e desafios.", "Autoconfiantes; Determinadas; Assertivas; Egocêntricas; Diretas; Ousadas; Dominadoras; Exigentes; Enérgicas; Determinadas", "Impaciência & Agressividade", "…perder o controlo; que se aproveitem dele; vulnerabilidade; exposição à crítica.", "...com ineficiência; ritmos lentos; conversa de circunstância; indecisão.", "Empatia, cooperação e controlo emocional.", "Pragmatismo; Escuta; Olhar nos olhos; Ser assertivo; Dar poder / controlo; Não interromper; Dar metas / desafios; Valorizar"], ["INFLUENCER", "Pessoas muito ativas que gostam de se relacionar.", "Animadas; Otimistas; Comunicativas; Extrovertidas; Amigáveis; Entusiastas", "Entusiasmo & Alegria", "…rejeição social; perda de influência; não ser considerado; desaprovação.", "...com formalidade no relacionamento; ir direto ao assunto ou tarefa; postura distante e reservada.", "Foco, organização e gestão de prioridades.", "Compreender; Estabelecer relação; Ser paciente; Manter um tom informal"], ["CAUTIOUS", "Pessoas mais reservadas que resolvem problemas.", "Sistemáticas; Reservadas; Analíticas; Factuais; Cautelosas; Precisas; Metódicas", "Ansiedade & Medo", "…errar; a crítica; perder o controlo das emoções; abordagens desleixadas.", "...com imprevistos; desorganização; falta de controlo; erro.", "Empatia, cooperação e controlo emocional.", "Dar respostas claras e rigorosas, sem rodeios; Demonstrar conhecimento, com factos concretos e pormenorizados; Usar um discurso calmo e seguro; Respeitar o ritmo dele; Ser um pouco formal"], ["STABILIZER", "Pessoas mais reservadas que gostam de se relacionar.", "Team players; Apoiantes; Tímidos; Consistentes; Firmes; Pacifistas; Bons ouvintes; Aconselhadores", "Paciência & Compaixão", "...a mudança; o conflito; rejeição; a perda da sua estabilidade e zona de conforto.", "...com insensibilidade; impaciência; pressão; falta de escuta.", "Gestão da mudança e resolução de problemas.", "Respeitar a privacidade; Não o expor e salvaguardar o status quo e a imagem dele; Manter o teu foco na relação e dar confiança; Dar explicações com calma; Valorizar a relação com ele; Não pressionar"]]};

function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());

  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}

async function copiar(txt, btn){
  try { await navigator.clipboard.writeText(txt); }
  catch { const i = document.createElement('textarea'); i.value = txt; document.body.appendChild(i); i.select(); document.execCommand('copy'); i.remove(); }
  if (!btn) return toast('Link copiado.');
  /* O próprio botão confirma a cópia e volta ao normal passados 2 segundos */
  clearTimeout(btn._t);
  if (!btn.dataset.orig) btn.dataset.orig = btn.innerHTML;
  btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.2l3 3L11.5 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Copiado';
  btn.classList.add('copiado');
  btn._t = setTimeout(() => { btn.innerHTML = btn.dataset.orig; btn.classList.remove('copiado'); }, 2000);
}

let DB;

function erroGuardar(e){ console.error(e); toast('Não foi possível guardar. Verifique a ligação e as regras do Firebase.'); }

async function initDB(){
  if (new URLSearchParams(location.search).get('modo') === 'local') return localDB();
  try {
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 6000));
    const [{ initializeApp }, fdb] = await Promise.race([Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js')
    ]), timeout]);
    const db = fdb.getDatabase(initializeApp(FB_CFG));
    const r = p => fdb.ref(db, `${ROOT}/${p}`);
    return {
      modo:'firebase',
      get: async p => (await fdb.get(r(p))).val(),
      set: (p,v) => fdb.set(r(p), v),
      update: (p,v) => fdb.update(r(p), v),
      remove: p => fdb.remove(r(p)),
      listen: (p, cb) => fdb.onValue(r(p), s => cb(s.val()), erroGuardar)
    };
  } catch (e) {
    console.warn('Firebase indisponível, a usar modo local.', e);
    return localDB();
  }
}

function localDB(){
  const K = 'fdl-local-db';
  const read = () => { try { return JSON.parse(LS.get(K)) || {}; } catch { return {}; } };
  const write = t => LS.set(K, JSON.stringify(t));
  const parts = p => p.split('/').filter(Boolean);
  const getAt = (t, p) => parts(p).reduce((o, k) => o == null ? undefined : o[k], t);
  const setAt = (t, p, v) => {
    const ks = parts(p); let o = t;
    ks.slice(0, -1).forEach(k => { if (typeof o[k] !== 'object' || o[k] === null) o[k] = {}; o = o[k]; });
    const last = ks[ks.length - 1];
    if (v === null || v === undefined) delete o[last]; else o[last] = clone(v);
  };
  const L = new Set();
  const notify = () => { const t = read(); L.forEach(l => l.cb(clone(getAt(t, l.p)) ?? null)); };
  window.addEventListener('storage', e => { if (e.key === K) notify(); });
  return {
    modo:'local',
    get: async p => clone(getAt(read(), p)) ?? null,
    set: async (p, v) => { const t = read(); setAt(t, p, v); write(t); notify(); },
    update: async (p, o) => { const t = read(); Object.entries(o).forEach(([k, v]) => setAt(t, `${p}/${k}`, v)); write(t); notify(); },
    remove: async p => { const t = read(); setAt(t, p, null); write(t); notify(); },
    listen: (p, cb) => { const l = {p, cb}; L.add(l); setTimeout(() => cb(clone(getAt(read(), p)) ?? null)); return () => L.delete(l); }
  };
}

/* ================= CÁLCULOS (mesma lógica da planilha) ================= */
function calcMot(m){
  const vs = new Set(lista(m?.valorizadas).map(Number)), ss = new Set(lista(m?.satisfeitas).map(Number));
  const val = Array(10).fill(0), sat = Array(10).fill(0);
  ITENS.forEach(it => { if (vs.has(it.n)) { val[it.c]++; if (ss.has(it.n)) sat[it.c]++; } });
  const gap = val.map((v, i) => v - sat[i]);
  const rank = (a, i) => 1 + a.filter(x => x > a[i]).length;
  const top = [...Array(10).keys()].filter(i => val[i] > 0 && rank(val, i) < 4).sort((a, b) => val[b] - val[a]);
  const mg = Math.max(...gap);
  const gaps = mg > 0 ? [...Array(10).keys()].filter(i => gap[i] === mg) : [];
  return {val, sat, gap, top, gaps, vs, ss};
}
function calcTarefa(t){
  const n = arr(t?.n, 10);
  const completa = n.every(v => v > 0);
  const cap = n.slice(0,5).reduce((a,b) => a+b, 0), von = n.slice(5).reduce((a,b) => a+b, 0);
  let m = null;
  if (completa) m = cap > 20 && von > 20 ? 'M4' : cap <= 20 && von <= 20 ? 'M1' : cap <= 20 ? 'M2' : 'M3';
  return {n, cap, von, completa, m};
}
function calcPD(p){
  const r = arr(p?.r, 24);
  const resp = r.filter(v => v > 0).length;
  const soma = (a, b) => r.slice(a, b).reduce((x, y) => x + y, 0);
  const pot = (soma(0,4) + soma(4,8) + soma(8,12)) / 3;
  const des = (soma(12,16) + soma(16,20) + soma(20,24)) / 3;
  let q = null;
  if (resp === 24) q = pot > 10 && des > 10 ? 'INDIGO' : pot > 10 ? 'VERMELHO' : des > 10 ? 'VERDE' : 'CINZA';
  return {r, resp, pot, des, q};
}
const tarefasDe = c => lista(c?.estilos?.tarefas).map(t => ({nome: t.nome || '', n: arr(t.n, 10)}));
/* Cada registo tem vários itens: situação + compromisso/ação + acompanhamento (lê também registos no formato antigo) */
function itensReg(r){
  if (!r) return [];
  const acao = x => x.compromisso || x.acao || '';
  if (lista(r.itens).length) return lista(r.itens).map(x => ({situacao:x.situacao || '', acao:acao(x), acompanhamento:x.acompanhamento || ''}));
  const sits = lista(r.situacoes).filter(Boolean).length ? lista(r.situacoes).filter(Boolean) : (r.situacao ? [r.situacao] : []);
  return sits.map((s, i) => ({situacao:s, acao:i === 0 ? acao(r) : '', acompanhamento:i === 0 ? (r.acompanhamento || '') : ''}));
}
const situacoes = r => itensReg(r).map(x => x.situacao).filter(Boolean);
const registos = (c, tipo) => Object.entries(c?.[tipo] || {}).map(([id, v]) => ({id, ...v})).sort((a, b) => (b.data || '').localeCompare(a.data || '') || (b.t || 0) - (a.t || 0));
function secoes(c){
  return {
    mot: !!c.motivadores?.respondidoEm,
    est: tarefasDe(c).some(t => calcTarefa(t).completa),
    pd: calcPD(c.potencial).q !== null,
    ipl: !!c.ipl?.e1,
    plano: registos(c, 'plano').length + registos(c, 'feedback').length > 0
  };
}

function barras(m){
  const max = Math.max(...m.val, 1);
  const ordem = [...Array(10).keys()].sort((a, b) => m.val[b] - m.val[a] || a - b);
  return `<div class="legend"><span><i style="background:var(--sat)"></i>Valorizadas e já satisfeitas</span><span><i style="background:var(--nsat)"></i>Valorizadas e ainda não satisfeitas</span></div>
  <div class="bars">${ordem.map(i => `<div class="bar ${m.val[i] ? '' : 'dim'} ${m.top.includes(i) ? 'top' : ''}">
    <span class="bl">${NEC[i]}</span>
    <span class="bar-t" title="${m.sat[i]} satisfeitas, ${m.gap[i]} por satisfazer"><span class="bar-s" style="width:${m.sat[i]/max*100}%"></span><span class="bar-n" style="width:${m.gap[i]/max*100}%"></span></span>
    <span class="bv">${m.val[i]}</span></div>`).join('')}</div>`;
}
/* Lista das afirmações escolhidas numa necessidade (por satisfazer primeiro) */
function listaEscolhas(i, m, comTitulo = false){
  const itens = ITENS.filter(it => it.c === i && m.vs.has(it.n)).sort((a, b) => m.ss.has(a.n) - m.ss.has(b.n));
  if (!itens.length) return '';
  return `<div class="npn">${comTitulo ? `<b>${itens.length === 1 ? '1 afirmação escolhida' : `${itens.length} afirmações escolhidas`}</b>` : ''}<ul>${itens.map(it => { const s = m.ss.has(it.n); return `<li><i class="cdot" style="background:var(${s ? '--sat' : '--nsat'})"></i><span>${esc(it.t)}</span><em>${s ? 'Já satisfeita' : 'Por satisfazer'}</em></li>`; }).join('')}</ul></div>`;
}
function cartaoNec(i, m, {acao=false, gap=false} = {}){
  const info = gap ? `${m.gap[i]} de ${m.val[i]} ${m.val[i] === 1 ? 'escolha' : 'escolhas'} por satisfazer` : `${m.val[i]} das 20 escolhas`;
  /* As afirmações escolhidas nesta necessidade: primeiro as por satisfazer, depois as satisfeitas */
  const itens = ITENS.filter(it => it.c === i && m.vs.has(it.n)).sort((a, b) => m.ss.has(a.n) - m.ss.has(b.n));
  const uid_ = 'n' + i + (gap ? 'g' : 't');
  const btn = (p, txt) => `<button class="ntog" data-a="nTog" data-p="${uid_}-${p}" aria-expanded="false" aria-controls="${uid_}-${p}">${txt}<i aria-hidden="true"></i></button>`;
  return `<div class="need ${gap ? 'gap' : ''}"><h3>${NEC[i]}</h3><span class="rk">${info}</span>
    <p>${esc(NDESC[i])}</p>
    <div class="ntogs">${itens.length ? btn('esc', itens.length === 1 ? '1 afirmação escolhida' : `${itens.length} afirmações escolhidas`) : ''}${acao ? btn('acao', 'Como atuar') : ''}</div>
    ${itens.length ? listaEscolhas(i, m).replace('<div class="npn">', `<div class="npn" id="${uid_}-esc" hidden>`) : ''}
    ${acao ? `<div class="npn acao" id="${uid_}-acao" hidden>${esc(NACAO[i])}</div>` : ''}</div>`;
}
function listasItens(m){
  const s = ITENS.filter(i => m.ss.has(i.n)), n = ITENS.filter(i => m.vs.has(i.n) && !m.ss.has(i.n));
  return `<div class="lists">
    <div><h4><i class="cdot" style="background:var(--sat)"></i>Já satisfeitas</h4><ul>${s.map(i => `<li>${esc(i.t)}</li>`).join('') || '<li class="muted">Nenhum item marcado como satisfeito.</li>'}</ul></div>
    <div><h4><i class="cdot" style="background:var(--nsat)"></i>Valorizadas, ainda não satisfeitas</h4><ul>${n.map(i => `<li>${esc(i.t)}</li>`).join('') || '<li class="muted">Todas as escolhas estão satisfeitas.</li>'}</ul></div>
  </div>`;
}
/* Matriz 2×2 em SVG. q = {tl,tr,bl,br: chave de cor + texto}, dots = [{x,y,l}] */
function matriz({min, max, cut, xLabel, yLabel, q, dots, forte = false}){
  /* Os nomes dos quadrantes ficam fora da área do gráfico (em cima e em baixo), para as bolinhas nunca taparem o texto */
  const sub = !!q.tl[2], LB = sub ? 36 : 22;
  const P = 30, TOP = LB + 4, Z = 262, W = P + Z + 6, H = TOP + Z + LB + 28;
  /* Escala em duas partes: o ponto de corte fica sempre ao centro, para os quatro quadrantes terem o mesmo tamanho */
  const sc = v => { v = Math.min(max, Math.max(min, v)); return v <= cut ? (v - min) / (cut - min) / 2 : 0.5 + (v - cut) / (max - cut) / 2; };
  const cx = P + Z / 2, cy = TOP + Z / 2;
  const rect = (x, y, w, h, k) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${forte ? COR[k].m : COR[k].c}"/>`;
  const rot = (x, y, [k, t, s]) => `<text x="${x}" y="${y}" text-anchor="middle" font-family="Raleway, sans-serif" font-weight="700" font-size="13" fill="${forte ? COR[k].m : COR[k].e}">${t}</text>
    ${s ? `<text x="${x}" y="${y + 14}" text-anchor="middle" font-size="11" fill="${forte ? COR[k].m : COR[k].e}">${s}</text>` : ''}`;
  const yBaixo = TOP + Z + 16;
  const seen = {};
  const cl = (v, a, b) => Math.min(b, Math.max(a, v));
  const pts = (dots || []).map(d => {
    let x = cl(P + sc(d.x) * Z, P + 14, P + Z - 14), y = cl(TOP + (1 - sc(d.y)) * Z, TOP + 14, TOP + Z - 14);
    const key = Math.round(x/12) + ':' + Math.round(y/12); const k = seen[key] = (seen[key] || 0) + 1;
    if (k > 1) { x += (k - 1) * 14; y -= (k - 1) * 6; }
    return `<g class="pt${d.id ? ' clicavel' : ''}" tabindex="0" role="img" aria-label="${esc(d.t || d.l)}" data-tip="${esc(d.t || '')}"${d.id ? ` data-a="sel" data-id="${d.id}"` : ''}><circle cx="${x}" cy="${y}" r="13" fill="#210000" stroke="#fff" stroke-width="2"/><text x="${x}" y="${y + 4}" text-anchor="middle" font-family="Raleway, sans-serif" font-weight="700" font-size="${String(d.l).length > 1 ? 10 : 12}" fill="#fff">${esc(d.l)}</text></g>`;
  }).join('');
  return `<svg class="matriz" viewBox="0 0 ${W} ${H}" role="img" aria-label="Matriz ${esc(xLabel)} por ${esc(yLabel)}">
    ${rot(P + Z / 4, 14, q.tl)}${rot(P + Z * 3 / 4, 14, q.tr)}
    ${rect(P, TOP, cx - P, cy - TOP, q.tl[0])}
    ${rect(cx, TOP, P + Z - cx, cy - TOP, q.tr[0])}
    ${rect(P, cy, cx - P, TOP + Z - cy, q.bl[0])}
    ${rect(cx, cy, P + Z - cx, TOP + Z - cy, q.br[0])}
    <line x1="${cx}" y1="${TOP}" x2="${cx}" y2="${TOP + Z}" stroke="#fff" stroke-width="3"/>
    <line x1="${P}" y1="${cy}" x2="${P + Z}" y2="${cy}" stroke="#fff" stroke-width="3"/>
    ${rot(P + Z / 4, yBaixo, q.bl)}${rot(P + Z * 3 / 4, yBaixo, q.br)}
    <text x="${P + Z/2}" y="${H - 6}" text-anchor="middle" font-size="12" fill="#5E5553">${esc(xLabel)} &#8594;</text>
    <text transform="translate(14 ${TOP + Z/2}) rotate(-90)" text-anchor="middle" font-size="12" fill="#5E5553">${esc(yLabel)} &#8594;</text>
    ${pts}</svg>`;
}
const matrizEstilos = dots => matriz({min:5, max:40, cut:20.5, xLabel:'Capacidade', yLabel:'Vontade', dots,

    ipl: c.ipl?.e1 ? [`<span><span class="cor" style="color:${COR[c.ipl.e1].e}">${IPL[c.ipl.e1].nome}</span>${c.ipl.e2 ? ` + <span class="cor" style="color:${COR[c.ipl.e2].e}">${IPL[c.ipl.e2].nome}</span>` : ''}</span>`, false] : ['Por definir', true],
    plano: regs ? [`${regs} ${regs === 1 ? 'registo' : 'registos'}`, false] : ['Sem registos', true]
  };
  const body = {resumo:tabResumo, mot:tabMot, est:tabEst, pd:tabPD, ipl:tabIPL, plano:tabPlano}[S.tab](c);
  main.innerHTML = `<div class="wrap">
    <header class="fhead"><span class="av big">${esc(iniciais(c.nome))}</span>
      <div><h1>${esc(c.nome)}</h1><p>${esc(c.funcao || 'Sem função definida')}</p></div>
      <div class="acts"><button class="btn ghost small" data-a="verLink">Link do mapeamento</button><button class="btn ghost small danger" data-a="remover">Remover</button></div></header>
    <nav class="tiles" aria-label="Secções da ficha">${TABS.map(([k, l]) => `<button class="tile ${S.tab === k ? 'on' : ''}" data-a="tab" data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ''}>
      <span class="tl">${l}</span><span class="tv ${val[k][1] ? 'muted' : ''}">${val[k][0]}</span></button>`).join('')}</nav>
    ${body}</div>`;
  main.scrollTop = y;
}

/* ---------- Ficha completa ---------- */
function tabResumo(c){
  const m = c.motivadores?.respondidoEm ? calcMot(c.motivadores) : null;
  const tars = tarefasDe(c).map((t, i) => ({...t, ...calcTarefa(t), i})).filter(t => t.nome || t.completa);
  const pontos = tars.filter(t => t.completa).map(t => ({x:t.cap, y:t.von, l:t.i + 1, t:t.nome || `Tarefa ${t.i + 1}`}));
  const pd = calcPD(c.potencial);
  const regs = [...registos(c, 'plano').map(r => ({...r, tipo:'Plano'})), ...registos(c, 'feedback').map(r => ({...r, tipo:'Feedback'}))]
    .sort((a, b) => (b.data || '').localeCompare(a.data || '')).slice(0, 3);
  const link = (tab, t) => `<button class="btn link" data-a="tab" data-tab="${tab}">${t}</button>`;
  return `<div class="grid2">
    <section class="box span2"><div class="box-h"><h2>Estilos de liderança</h2>${link('est', tars.length ? 'Editar' : 'Avaliar tarefas')}</div>
      ${tars.length ? `<div class="est-res"><div>${matrizEstilos(pontos)}</div>
        <div class="tblwrap"><table class="tbl"><thead><tr><th></th><th>Tarefa ou responsabilidade</th><th>Classificação</th><th>Estilo de liderança</th></tr></thead><tbody>
        ${tars.map(t => `<tr><td><span class="tnum sm">${t.i + 1}</span></td><td>${esc(t.nome || 'Sem nome')}</td><td>${t.m ? chip(t.m, `${t.m} ${MAT[t.m].nome}`) : '<span class="muted">Por avaliar</span>'}</td><td>${t.m ? MAT[t.m].estilo : ''}</td></tr>`).join('')}</tbody></table></div></div>`
      : '<p class="muted">Ainda sem tarefas avaliadas.</p>'}</section>
    <section class="box"><div class="box-h"><h2>Estrutura motivacional</h2>${link('mot', m ? 'Ver detalhe' : 'Ver link')}</div>
      ${m ? `<div class="grid2" style="gap:16px">
        <div><span class="sub">Necessidades mais valorizadas</span><ul class="plain">${m.top.map(i => `<li>${NEC[i]}</li>`).join('')}</ul></div>
        <div><span class="sub">Valorizadas e não satisfeitas</span><ul class="plain">${m.gaps.map(i => `<li>${NEC[i]}</li>`).join('') || '<li class="muted">Nenhuma</li>'}</ul></div></div>`
      : `<p class="muted">${esc(primeiroNome(c.nome))} ainda não respondeu ao Mapeamento Motivacional.</p>`}</section>
    <section class="box"><div class="box-h"><h2>Potencial e desempenho</h2>${link('pd', pd.q ? 'Ver detalhe' : 'Avaliar')}</div>
      ${pd.q ? `<p>${chip(pd.q, QUAD[pd.q].nome)}</p><p class="qdesc">${esc(QUAD[pd.q].desc.split('\n')[0])}</p>` : `<p class="muted">${pd.resp ? `${pd.resp} de 24 afirmações avaliadas.` : 'Ainda por avaliar.'}</p>`}</section>
    <section class="box"><div class="box-h"><h2>Perfil IPL</h2>${link('ipl', c.ipl?.e1 ? 'Ver detalhe' : 'Definir')}</div>
      ${c.ipl?.e1 ? [c.ipl.e1, c.ipl.e2].filter(Boolean).map((k, i) => `<p style="margin-bottom:10px"><span class="sub">Estilo dominante ${i + 1}</span>${chip(k, IPL[k].nome)} <span class="txt">${esc(IPL[k].desc)}</span></p>`).join('') : '<p class="muted">Ainda por definir.</p>'}</section>
    <section class="box"><div class="box-h"><h2>Plano e feedback</h2>${link('plano', 'Abrir registos')}</div>
      ${regs.length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>Data</th><th>Tipo</th><th>Situação</th></tr></thead><tbody>
        ${regs.map(r => `<tr><td class="d">${fmtD(r.data)}</td><td>${r.tipo}</td><td>${(ss => `<span class="clamp2">${esc(ss[0] || '')}</span>${ss.length > 1 ? `<span class="mais">+ ${ss.length - 1} ${ss.length === 2 ? 'situação' : 'situações'}</span>` : ''}`)(situacoes(r))}</td></tr>`).join('')}</tbody></table></div>`
      : '<p class="muted">Ainda sem registos.</p>'}</section>
  </div>`;
}

/* ---------- Motivadores ---------- */

/* ---------- Estilos de liderança ---------- */
function tabEst(c){

  const chipM = r => r.m ? chip(r.m, `${r.m} ${MAT[r.m].nome}: ${MAT[r.m].estilo}`) : `<span class="chip" style="background:var(--soft2);color:var(--ink2)">${r.n.filter(Boolean).length} de 10 critérios</span>`;
  const cartoes = tars.map((t, i) => { const r = calc[i];
    /* Fechada: só o resumo. Aberta (a editar): nome, critérios e remover */

      <div class="task-top"><span class="tnum">${i + 1}</span>
        <div class="tinfo"><b>${esc(t.nome || 'Tarefa sem nome')}</b><small><span>Capacidade ${r.cap} / 40</span><span>Vontade ${r.von} / 40</span>${r.m ? `<span>Estilo ${MAT[r.m].estilo}</span>` : ''}</small></div>
        ${r.m ? chip(r.m, `${r.m} ${MAT[r.m].nome.split(' /')[0]}`) : chipM(r)}
        <button class="btn ghost small" data-a="editTask" data-i="${i}">Editar</button></div></div>`;
    return `<div class="task aberta">
    <div class="task-top"><span class="tnum">${i + 1}</span>
      <input class="inp" data-bind="estilos/tarefas/${i}/nome" value="${esc(t.nome)}" placeholder="Nome da tarefa ou responsabilidade" aria-label="Nome da tarefa ${i + 1}">
      ${chipM(r)}</div>

      <div class="crit-col"><h4>Capacidade <span>${r.cap} / 40</span></h4>${CRIT.slice(0, 5).map((l, k) => `<div class="crit"><span>${l}</span>${seg(i, k, r.n[k])}</div>`).join('')}</div>
      <div class="crit-col"><h4>Vontade <span>${r.von} / 40</span></h4>${CRIT.slice(5).map((l, k) => `<div class="crit"><span>${l}</span>${seg(i, k + 5, r.n[k + 5])}</div>`).join('')}</div>

/* ---------- escrita ---------- */
function setDeep(o, path, v){
  const ks = path.split('/');
  ks.slice(0, -1).forEach((k, i) => { if (o[k] == null || typeof o[k] !== 'object') o[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; o = o[k]; });
  const last = ks[ks.length - 1];
  if (v === undefined || v === null) { Array.isArray(o) ? o.splice(Number(last), 1) : delete o[last]; } else o[last] = v;
}
async function W(path, v){
  setDeep(colab(), path, clone(v));
  renderSide(); renderMain();
  try { v == null ? await DB.remove(cpath(path)) : await DB.set(cpath(path), v); } catch (e) { erroGuardar(e); }
}
const timers = {};
/* As caixas de texto crescem com o conteúdo, para ficar fácil de ler */
function autoAltura(el){ el.style.height = 'auto'; el.style.height = el.scrollHeight + 2 + 'px'; }
document.addEventListener('input', e => { if (e.target.matches?.('textarea.inp')) autoAltura(e.target); });
new MutationObserver(() => document.querySelectorAll('textarea.inp').forEach(t => { if (t.value && !t.dataset.aj) { t.dataset.aj = 1; autoAltura(t); } })).observe(document.body, {childList:true, subtree:true});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-bind]'); if (!el || !colab()) return;
  const path = el.dataset.bind; setDeep(colab(), path, el.value);
  const full = cpath(path);
  clearTimeout(timers[full]);
  timers[full] = setTimeout(() => DB.set(full, el.value).catch(erroGuardar), 450);
});

/* ================= TESTE DO COLABORADOR ================= */
const TT = {};
function embaralhar(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
/* O progresso fica guardado em dois sítios: no navegador (imediato) e na base de dados (a cada alteração),
   para a pessoa não perder o mapeamento se fechar a página, mudar de navegador ou de computador */
let tRasc = null;
function guardarProgresso(){
  const p = {v:[...TT.v], s:[...TT.s], ordem:TT.ordem, etapa:TT.etapa, t:Date.now()};
  LS.set('fdl-teste-' + TT.token, JSON.stringify(p));
  clearTimeout(tRasc);
  tRasc = setTimeout(() => DB.set(`lideres/${TT.L}/equipa/${TT.C}/rascunho`, p).catch(e => console.warn('Rascunho não guardado', e)), 600);
}

async function startTeste(token){
  show('teste');
  $('#v-teste').innerHTML = `<div class="t-wrap"><p class="muted">A carregar…</p></div>`;
  const conv = await DB.get(`convites/${token}`);
  const c = conv ? await DB.get(`lideres/${conv.lider}/equipa/${conv.colab}`) : null;
  if (!c) { $('#v-teste').innerHTML = `<div class="t-wrap"><h1 class="t-title">Link inválido</h1><p>Este link de mapeamento não existe ou foi removido. Peça um novo link à sua liderança.</p></div>`; return; }
  Object.assign(TT, {token, L:conv.lider, C:conv.colab, nome:c.nome, liderNome: await DB.get(`lideres/${conv.lider}/nome`) || 'a sua liderança', v:new Set, s:new Set, ordem:[], etapa:'capa', enviado:false});
  if (c.motivadores?.respondidoEm) {
    TT.v = new Set(lista(c.motivadores.valorizadas).map(Number)); TT.s = new Set(lista(c.motivadores.satisfeitas).map(Number));
    TT.etapa = 'resultado'; TT.enviado = c.motivadores.respondidoEm;
  } else {
    let local = null; try { local = JSON.parse(LS.get('fdl-teste-' + token)); } catch {}
    const remoto = c.rascunho || null;
    /* usa o progresso mais recente entre o deste navegador e o guardado na base de dados */
    const p = [local, remoto].filter(Boolean).sort((a, b) => (b.t || 0) - (a.t || 0))[0];
    if (p) { TT.v = new Set(lista(p.v).map(Number)); TT.s = new Set(lista(p.s).map(Number)); TT.ordem = lista(p.ordem).map(Number); TT.retomar = ['e1', 'e2'].includes(p.etapa) && TT.v.size ? p.etapa : null; TT.etapa = 'capa'; }
  }
  if (TT.ordem.length !== 100) TT.ordem = embaralhar(ITENS.map(i => i.n));
  renderTeste();
}

/* ===== PDF do resultado (jsPDF, desenhado diretamente, igual em computador e telemóvel) ===== */
function carregarJsPDF(){
  if (window.jspdf) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
function carregarLogo(){
  return new Promise(res => {
    const img = new Image(); img.crossOrigin = 'anonymous';
    const fim = setTimeout(() => res(null), 4000);
    img.onload = () => { clearTimeout(fim); try { const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight; c.getContext('2d').drawImage(img, 0, 0); res({src:c.toDataURL('image/png'), w:img.naturalWidth, h:img.naturalHeight}); } catch { res(null); } };
    img.onerror = () => { clearTimeout(fim); res(null); };
    img.src = 'https://i.imgur.com/fQCcuMs.png';
  });
}
async function gerarPDF(btn){
  const orig = btn.innerHTML; btn.disabled = true; btn.textContent = 'A gerar o PDF…';
  try {
    await carregarJsPDF();
    const logo = await carregarLogo();
    const m = calcMot({valorizadas:[...TT.v], satisfeitas:[...TT.s]});
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});
    const PW = doc.internal.pageSize.getWidth(), PH = doc.internal.pageSize.getHeight(), M = 48, CW = PW - M * 2;
    const INK = [33, 0, 0], TXT = [94, 85, 83], CLARO = [148, 138, 135], SAT = [207, 229, 177], NSAT = [94, 85, 83], FUNDO = [247, 244, 243], LINHA = [231, 225, 222];
    let y = 0;
    const cab = () => {
      doc.setFillColor(...INK); doc.rect(0, 0, PW, 64, 'F');
      if (logo) { const h = 40, w = h * logo.w / logo.h; doc.addImage(logo.src, 'PNG', (PW - w) / 2, 12, w, h); }
      else { doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.text('crescimentum', PW / 2, 38, {align:'center'}); }
      y = 96;
    };
    const espaco = h => { if (y + h > PH - 56) { doc.addPage(); cab(); } };
    const texto = (s, {size = 10.5, cor = TXT, bold = false, x = M, w = CW, lh = 1.45, antes = 0} = {}) => {
      doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(size); doc.setTextColor(...cor);
      const ls = doc.splitTextToSize(String(s), w), h = ls.length * size * lh;
      espaco(h + antes); y += antes; doc.text(ls, x, y + size, {lineHeightFactor:lh}); y += h;
    };
    const titulo = s => { espaco(60); texto(s, {size:14, cor:INK, bold:true, antes:18}); y += 6; };

    cab();
    texto('O seu mapeamento motivacional', {size:20, cor:INK, bold:true});
    texto(`${TT.nome}${TT.enviado ? `, respondido a ${fmtTs(TT.enviado)}` : ''}`, {size:10, cor:CLARO, antes:2});
    texto('As 100 afirmações estão ligadas a 10 necessidades motivacionais. Veja onde as suas escolhas se concentraram e o que ainda pede atenção.', {antes:10});

    /* gráfico */
    titulo('Onde as suas escolhas se concentraram');
    doc.setFontSize(9); doc.setFont('helvetica', 'normal'); doc.setTextColor(...TXT);
    doc.setFillColor(...SAT); doc.rect(M, y, 9, 9, 'F'); doc.text('Valorizadas e já satisfeitas', M + 14, y + 8);
    const x2 = M + 14 + doc.getTextWidth('Valorizadas e já satisfeitas') + 20;
    doc.setFillColor(...NSAT); doc.rect(x2, y, 9, 9, 'F'); doc.text('Valorizadas e ainda não satisfeitas', x2 + 14, y + 8);
    y += 22;
    const max = Math.max(...m.val, 1), LW = 120, BW = CW - LW - 30, BH = 13;
    [...Array(10).keys()].sort((a, b) => m.val[b] - m.val[a] || a - b).forEach(i => {
      espaco(BH + 9);
      doc.setFont('helvetica', m.top.includes(i) ? 'bold' : 'normal'); doc.setFontSize(9.5); doc.setTextColor(...(m.val[i] ? INK : CLARO));
      doc.text(NEC[i], M, y + 10);
      doc.setFillColor(...FUNDO); doc.rect(M + LW, y, BW, BH, 'F');
      const ws = m.sat[i] / max * BW, wn = m.gap[i] / max * BW;
      if (ws) { doc.setFillColor(...SAT); doc.rect(M + LW, y, ws, BH, 'F'); }
      if (wn) { doc.setFillColor(...NSAT); doc.rect(M + LW + ws, y, wn, BH, 'F'); }
      doc.setFont('helvetica', 'normal'); doc.setTextColor(...TXT); doc.text(String(m.val[i]), PW - M, y + 10, {align:'right'});
      y += BH + 9;
    });

    /* necessidades em destaque */
    const bloco = (i, meta) => {
      espaco(70);
      texto(NEC[i], {size:12, cor:INK, bold:true, antes:10});
      texto(meta, {size:9, cor:CLARO, antes:1});
      texto(NDESC[i], {antes:4});
    };
    titulo('O que mais pesa para si');
    m.top.forEach(i => bloco(i, `${m.val[i]} das 20 escolhas`));
    titulo('O que pede mais atenção hoje');
    if (m.gaps.length) m.gaps.forEach(i => bloco(i, `${m.gap[i]} de ${m.val[i]} ${m.val[i] === 1 ? 'escolha' : 'escolhas'} por satisfazer`));
    else texto('Todas as necessidades que valoriza estão, na sua perceção, satisfeitas.');

    /* as 20 escolhas */
    titulo('As suas 20 escolhas');
    const lista_ = (nome, cor, itens, vazio) => {
      espaco(40);
      doc.setFillColor(...cor); doc.rect(M, y + 4, 10, 10, 'F');
      texto(nome, {size:11, cor:INK, bold:true, x:M + 16, w:CW - 16, antes:0});
      y += 4;
      if (!itens.length) texto(vazio, {cor:CLARO});
      itens.forEach((it, k) => {
        doc.setFontSize(10); const ls = doc.splitTextToSize(it.t, CW - 16); espaco(ls.length * 13.5 + 6);
        if (k) { doc.setDrawColor(...LINHA); doc.line(M + 16, y, PW - M, y); }
        y += 4; texto(it.t, {size:10, lh:1.35, x:M + 16, w:CW - 16});
      });
      y += 10;
    };
    lista_('Já satisfeitas', SAT, ITENS.filter(i => m.ss.has(i.n)), 'Nenhum item marcado como satisfeito.');
    lista_('Valorizadas, ainda não satisfeitas', NSAT, ITENS.filter(i => m.vs.has(i.n) && !m.ss.has(i.n)), 'Todas as escolhas estão satisfeitas.');

    /* rodapé com páginas */
    const n = doc.getNumberOfPages();
    for (let p = 1; p <= n; p++) { doc.setPage(p); doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...CLARO); doc.text(`Mapeamento Motivacional   |   Página ${p} de ${n}`, PW / 2, PH - 26, {align:'center'}); }
    doc.save('Mapeamento Motivacional - O meu resultado.pdf');
  } catch (e) {
    console.error(e); toast('Não foi possível gerar o PDF. Verifique a ligação à internet e tente de novo.');
  } finally { btn.disabled = false; btn.innerHTML = orig; }
}
function atualizarE1(){
  const n = TT.v.size;
  $('#t-fill').style.width = (n / 20 * 100) + '%';
  const b = $('#t-count'); b.textContent = `${n} / 20`; b.classList.toggle('full', n === 20);
  $('#t-next1').disabled = n !== 20;
  document.querySelectorAll('#t-list .icard').forEach(c => {
    const on = TT.v.has(Number(c.dataset.n));
    c.classList.toggle('sel', on); c.setAttribute('aria-pressed', on);
    c.classList.toggle('bloq', n >= 20 && !on);
  });
}

/* ================= DEMONSTRAÇÃO ================= */
function escolher(prefs){
  const v = [], s = [];
  prefs.forEach(([cat, qt, sat], idx) => {
    const itens = ITENS.filter(i => i.c === cat);
    const off = idx % 3;
    const esc_ = itens.slice(off).concat(itens.slice(0, off)).slice(0, qt).map(i => i.n);
    v.push(...esc_); s.push(...esc_.slice(0, sat));
  });
  return {v, s};
}
